<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Страница не найдена | Мария Архипова</title>
  <meta name="description" content="Страница не найдена. Вернитесь на главную.">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    /* ========== ПЕРЕМЕННЫЕ ========== */
    :root {
      --bg: #0B0C10; --surface: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.08); --text: #E5E7EB;
      --text-sec: #9CA3AF; --accent: #14b8a6;
      --accent-gradient: linear-gradient(90deg, #14b8a6, #f472b6, #f97316);
      --font: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --header-h: 64px;
    }
    [data-theme="light"] {
      --bg: #F8F9FA; --surface: rgba(0,0,0,0.04);
      --border: rgba(0,0,0,0.08); --text: #1F2937;
      --text-sec: #6B7280; --accent: #0f766e;
      --accent-gradient: linear-gradient(90deg, #0f766e, #f472b6, #f97316);
    }

    /* ========== БАЗА ========== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { max-width: 100vw; overflow-x: hidden; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font); line-height: 1.6;
      padding-top: var(--header-h); transition: background 0.3s, color 0.3s;
      overflow-wrap: break-word;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 20px; width: 100%; }
    .mono { font-family: var(--mono); font-size: .75rem; letter-spacing: .05em; color: var(--text-sec); text-transform: uppercase; }
    
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 24px; background: var(--accent); color: #fff; border-radius: 6px; text-decoration: none; font-weight: 500; transition: 0.2s; border: none; cursor: pointer; font-size: .95rem; }
    .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
    
    /* ========== HEADER ========== */
    .site-header {
      position: fixed; top: 0; left: 0; right: 0; height: var(--header-h);
      background: var(--bg); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border); z-index: 1000;
      display: flex; align-items: center;
    }
    .hdr { display: flex; justify-content: space-between; align-items: center; max-width: 1280px; margin: 0 auto; padding: 0 20px; width: 100%; }
    .logo { font-weight: 600; font-size: 1rem; color: var(--text); text-decoration: none; }
    .theme-btn { padding: 6px 10px; font-size: 1.1rem; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--border); color: var(--text); cursor: pointer; flex-shrink: 0; }

    /* ========== 404 КОНТЕНТ ========== */
    .error-page {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 40px 20px; text-align: center;
    }
    .error-content { max-width: 600px; width: 100%; }
    
    .error-code {
      font-size: 5rem; font-weight: 600; line-height: 1; margin-bottom: 8px;
      background: var(--accent-gradient); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; background-clip: text;
    }
    .error-title { font-size: 1.5rem; font-weight: 600; margin-bottom: 12px; }
    .error-desc { color: var(--text-sec); margin-bottom: 32px; font-size: 1rem; }
    
    /* ТВОЙ КОТ */
    .cat-wrapper {
      width: 100%; max-width: 500px; height: auto;
      margin: 0 auto 32px;
    }
    .cat-svg {
      width: 100%; height: auto; display: block;
    }
    .cat-svg path,
    .cat-svg circle,
    .cat-svg line,
    .cat-svg polyline,
    .cat-svg polygon,
    .cat-svg ellipse {
      stroke: var(--text) !important;
      fill: none !important;
    }
    .cat-svg circle[fill="var(--text)"] {
      fill: var(--accent) !important;
      stroke: none !important;
    }
    
    /* Футер */
    .site-footer { border-top: 1px solid var(--border); padding: 24px 0; text-align: center; font-size: .8rem; color: var(--text-sec); }
    .site-footer a { color: var(--text-sec); text-decoration: none; }
    .site-footer a:hover { color: var(--accent); }

    /* ========== АДАПТИВ (ИСПРАВЛЕН) ========== */
    @media(max-width: 768px) {
      .error-page { padding: 24px 16px; align-items: flex-start; }
      .error-code { font-size: 3.5rem; }
      .error-title { font-size: 1.25rem; }
      .cat-wrapper { max-width: 350px; margin-bottom: 20px; }
    }
    @media(max-width: 480px) {
      .error-page { padding: 16px 12px; align-items: flex-start; justify-content: flex-start; }
      .cat-wrapper { max-width: 260px; margin-bottom: 12px; }
      .error-code { font-size: 2.8rem; }
      .error-desc { font-size: 0.95rem; margin-bottom: 20px; }
      .btn { width: 100%; }
    }
  </style>
</head>

  <script>
    // Тема (по умолчанию тёмная)
    const t=document.getElementById('themeToggle'),h=document.documentElement;
    const s=localStorage.getItem('theme');
    // 🐱 на тёмной, 🌙 на светлой
    function a(th){h.dataset.theme=th;t.textContent=th==='light'?'🌙':'🐱';localStorage.setItem('theme',th)}
    a(s||'dark');
    t.addEventListener('click',()=>a(h.dataset.theme==='light'?'dark':'light'));

    // Год в футере
    const yearEl=document.getElementById('footerYear');
    if(yearEl) yearEl.textContent=new Date().getFullYear();
  </script>
